<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Интерактивные медиа и цифровые индустрии</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#05060a; --fg:#e8e6df; --dim:#8d8b84; --acc:#ffd166; --cyan:#4fd1ff; --line:rgba(255,255,255,.1); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { display:flex; flex-direction:column; padding:clamp(20px, 4vh, 48px) clamp(16px, 4vw, 64px); gap:clamp(16px, 3.5vh, 40px);
         background:radial-gradient(1200px 700px at 15% 110%, rgba(79,209,255,.08), transparent 60%), radial-gradient(1000px 600px at 90% -10%, rgba(255,209,102,.07), transparent 60%), var(--bg); }

  header { display:flex; align-items:center; gap:clamp(16px, 2.5vw, 36px); }
  #logo { height:clamp(48px, 9vh, 96px); width:auto; display:block; }
  .eyebrow { color:var(--acc); font-size:clamp(14px, 1.6vw, 20px); font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin-bottom:6px; }
  h1 { margin:0; font-size:clamp(28px, 4.4vw, 64px); font-weight:700; line-height:1.05; letter-spacing:-.01em; max-width:22ch; }

  main { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px, 2vw, 28px); }
  .tile { position:relative; overflow:hidden; border-radius:24px; border:1px solid var(--line); background:#0b0d14; color:var(--fg); font:inherit; text-align:left; cursor:pointer; padding:0;
          display:flex; flex-direction:column; justify-content:flex-end; transition:transform .25s ease, border-color .25s ease; isolation:isolate; }
  .tile:hover { border-color:rgba(255,255,255,.28); }
  .tile:active { transform:scale(.985); }
  .tile:focus-visible { outline:3px solid var(--acc); outline-offset:4px; }
  .tile .bg { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; transition:transform 6s ease; }
  .tile:hover .bg { transform:scale(1.04); }
  .tile::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(5,6,10,0) 30%, rgba(5,6,10,.6) 58%, rgba(5,6,10,.94) 100%); }
  .tile .text { padding:clamp(18px, 3vw, 40px); text-shadow:0 1px 14px rgba(0,0,0,.6); }
  .tile .kind { font-size:clamp(13px, 1.3vw, 17px); color:#c9c6bd; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  .tile .name { font-size:clamp(30px, 4.2vw, 64px); font-weight:700; line-height:1; display:flex; align-items:center; gap:.35em; }
  .tile .sub { margin-top:10px; font-size:clamp(15px, 1.6vw, 22px); color:var(--fg); opacity:.85; max-width:30ch; }
  .tile .go { display:inline-flex; align-items:center; justify-content:center; width:1em; height:1em; border-radius:50%; font-size:.8em; background:var(--acc); color:#1a1300; }
  .tile .go svg { width:42%; height:42%; }
  #fly-tile .bg { background:#05060a; object-position:50% 20%; }
  #trailer-tile .bg.fallback { background:radial-gradient(80% 90% at 70% 30%, rgba(255,209,102,.22), transparent 70%), radial-gradient(70% 80% at 20% 80%, rgba(79,209,255,.18), transparent 70%), #0b0d14; }

  footer { color:var(--dim); text-align:center; font-size:clamp(13px, 1.3vw, 16px); }

  /* trailer on the whole screen */
  #player { position:fixed; inset:0; background:#000; display:none; z-index:10; }
  #player.on { display:block; }
  #player video { width:100%; height:100%; object-fit:contain; background:#000; }
  #back { position:absolute; left:20px; top:20px; z-index:2; font:inherit; font-size:17px; padding:10px 16px; border-radius:10px; cursor:pointer;
          color:var(--fg); background:rgba(10,12,18,.72); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(8px); }
  #back:hover { background:rgba(30,32,40,.85); }
  #player-msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; font-size:clamp(20px, 2.4vw, 32px); color:var(--fg); padding:24px; }

  @media (max-width: 720px) {
    html,body { overflow:auto; }
    main { grid-template-columns:1fr; }
    .tile { min-height:44vh; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .tile .bg { transition:none; } .tile:hover .bg { transform:none; } }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <div>
    <div class="eyebrow">Магистратура</div>
    <h1>Интерактивные медиа и цифровые индустрии</h1>
  </div>
</header>

<main>
  <button class="tile" id="fly-tile" aria-label="NeuroFly: интерактивный экспонат">
    <img class="bg" src="/panel/neurofly.jpg" alt="">
    <div class="text">
      <div class="kind">Интерактивный экспонат</div>
      <div class="name">NeuroFly <span class="go"><svg viewBox="0 0 10 10"><path d="M2 5h6M5.5 2.5 8 5 5.5 7.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="sub">Модель мозга мухи. Попробуйте изменить её поведение.</div>
    </div>
  </button>
  <button class="tile" id="trailer-tile" aria-label="Смотреть трейлер">
    <video class="bg" id="preview" muted playsinline preload="metadata"></video>
    <div class="text">
      <div class="kind">Видео</div>
      <div class="name">Трейлер <span class="go"><svg viewBox="0 0 10 10"><path d="M3 2v6l5-3z" fill="currentColor"/></svg></span></div>
      <div class="sub">Смотреть на весь экран</div>
    </div>
  </button>
</main>

<footer>Коснитесь, чтобы выбрать</footer>

<div id="player">
  <button id="back">← Назад</button>
  <video id="trailer" playsinline></video>
  <div id="player-msg">Трейлер сейчас недоступен</div>
</div>

<script>
// Start screen of the kiosk. The trailer is a local file (not in git): web/trailer/trailer.mp4
const TRAILER = '/trailer/trailer.mp4';
const $ = (s) => document.querySelector(s);

// logo: web/panel/logo.svg, else logo.png, else no logo
(function logo() {
  const img = $('#logo'), files = ['/panel/logo.svg', '/panel/logo.png'];
  let k = 0;
  img.onload = () => { img.hidden = false; };
  img.onerror = () => { k += 1; if (k < files.length) img.src = files[k]; };
  img.src = files[0];
})();

// a still of the trailer as the tile's background; a gradient when the file is missing
const preview = $('#preview');
preview.onerror = () => { preview.removeAttribute('src'); preview.classList.add('fallback'); console.warn(`NeuroFly panel: положите трейлер в web${TRAILER}`); };
preview.onloadedmetadata = () => { try { preview.currentTime = Math.min(3, preview.duration / 3 || 0); } catch (e) {} };
preview.src = TRAILER;

$('#fly-tile').onclick = () => { location.href = '/neurofly'; };

const player = $('#player'), video = $('#trailer'), msg = $('#player-msg');
let msgTimer = null;
function openTrailer() {
  player.classList.add('on'); msg.style.display = 'none'; video.style.display = 'block';
  video.src = TRAILER; video.currentTime = 0;
  video.play().catch(() => {});
  if (player.requestFullscreen && !document.fullscreenElement) player.requestFullscreen().catch(() => {});
}
function closeTrailer() {
  clearTimeout(msgTimer);
  video.pause(); video.removeAttribute('src'); video.load();
  player.classList.remove('on');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
video.onended = closeTrailer;
video.onerror = () => {
  if (!player.classList.contains('on')) return;
  video.style.display = 'none'; msg.style.display = 'flex';
  msgTimer = setTimeout(closeTrailer, 3000);
};
$('#trailer-tile').onclick = openTrailer;
$('#back').onclick = closeTrailer;
addEventListener('keydown', (e) => { if (e.key === 'Escape' && player.classList.contains('on')) closeTrailer(); });
</script>
</body>
</html>
